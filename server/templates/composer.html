{% if locked %}
<div id="composer" class="composer locked-note">
  This room is locked &mdash; it is read-only. Exports remain available.
</div>
{% else %}
<form id="composer" class="composer" hx-post="/r/{{ token }}/messages" hx-swap="outerHTML">
  {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
  <div class="composer-row">
    <input class="expr-input" name="expr" value="{{ expr_draft }}" maxlength="200"
           autocomplete="off" autofocus spellcheck="false"
           aria-label="Dice roll" placeholder="&#127922; 2d6+3">
    <input class="comment-input" name="comment" value="{{ comment_draft }}" maxlength="2000"
           autocomplete="off" aria-label="Comment" placeholder="Say something (optional)">
    <button class="primary">Send</button>
  </div>
</form>
{% endif %}
