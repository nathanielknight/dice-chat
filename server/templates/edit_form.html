<li class="msg editing" id="msg-{{ seq }}">
  <form hx-post="/r/{{ token }}/messages/{{ seq }}" hx-target="#msg-{{ seq }}" hx-swap="outerHTML">
    {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
    <div class="composer-row">
      {# Land the cursor in the field the message is mostly about. #}
      <input class="expr-input" name="expr" value="{{ expr }}" maxlength="200"
             autocomplete="off" spellcheck="false"{% if !expr.is_empty() %} autofocus
             title="Saving re-rolls with fresh dice"{% endif %}
             aria-label="Dice roll" placeholder="&#127922; 2d6+3">
      <input class="comment-input" name="comment" value="{{ comment }}" maxlength="2000"
             autocomplete="off"{% if expr.is_empty() %} autofocus{% endif %}
             aria-label="Comment" placeholder="Comment (optional)">
      <button class="primary">{% if !expr.is_empty() %}Save &amp; re-roll{% else %}Save{% endif %}</button>
      <button type="button" class="subtle" hx-get="/r/{{ token }}/messages/{{ seq }}"
              hx-target="#msg-{{ seq }}" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</li>
